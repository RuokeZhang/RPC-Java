syntax = "proto3";

package com.kama.proto;

option java_package = "com.kama.proto";
option java_outer_classname = "RpcRequestProto";

message RpcRequest {
  int32 request_id = 1;
  string interface_name = 2;
  string method_name = 3;
  repeated string parameter_types = 4;
  repeated bytes parameters = 5;
}

